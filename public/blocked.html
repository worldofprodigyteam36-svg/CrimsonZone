<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CrimsonZone — Blocked</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
    .icon{width:clamp(84px,18vw,132px);height:clamp(84px,18vw,132px);margin:0 auto 18px;color:var(--crimson);filter:drop-shadow(0 0 28px var(--crimson-glow))}
    .icon svg{display:block;width:100%;height:100%}
    h2{font-family:var(--font-display);font-size:26px;margin-bottom:10px}
    p{color:var(--text-2);margin-bottom:12px;max-width:360px;margin-left:auto;margin-right:auto}
    .url{display:block;color:var(--crimson);font-size:13px;font-family:monospace;word-break:break-all;max-width:420px;margin:0 auto 28px;opacity:0.75}
    .home-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:var(--crimson);border-radius:10px;color:#fff;text-decoration:none;font-weight:600;transition:.2s}
    .home-btn:hover{background:var(--crimson-light);transform:translateY(-2px);box-shadow:0 8px 20px var(--crimson-glow)}
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div>
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" role="img" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M2 12h20"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      <path d="M4.5 7h15"/>
      <path d="M4.5 17h15"/>
      <path d="M6.5 6.5 17.5 17.5" stroke="#7f0d19" stroke-width="2.6"/>
      <path d="M17.5 6.5 6.5 17.5" stroke="#7f0d19" stroke-width="2.6"/>
    </svg>
  </div>
  <h2>Blocked by Proxy</h2>
  <p>This destination is known to expose the visitor's public IP address.</p>
  <span class="url">{{BLOCKED_URL}}</span>
  <br>
</div>
</body>
</html>
