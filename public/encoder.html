<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CrimsonZone - UV Link Encoder</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .encoder{width:min(680px,100%);text-align:left}
    .encoder h1{font-family:var(--font-display);font-size:clamp(34px,8vw,58px);color:var(--crimson);line-height:1;margin-bottom:10px;text-shadow:0 0 48px var(--crimson-glow)}
    .encoder p{color:var(--text-2);margin-bottom:22px}
    .field{display:flex;gap:10px;margin-bottom:14px}
    .field input,.output{width:100%;border:1px solid rgba(220,28,46,.28);background:rgba(8,10,22,.78);color:var(--text);border-radius:10px;padding:14px 16px;font:500 15px var(--font-body);outline:none}
    .field input:focus,.output:focus{border-color:var(--crimson);box-shadow:0 0 0 3px rgba(220,28,46,.14)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 18px}
    button,a.btn{border:0;border-radius:10px;padding:12px 18px;background:var(--crimson);color:#fff;text-decoration:none;font-weight:700;cursor:pointer;transition:.2s}
    button:hover,a.btn:hover{background:var(--crimson-light);transform:translateY(-1px);box-shadow:0 8px 20px var(--crimson-glow)}
    button.secondary{background:rgba(255,255,255,.08);color:var(--text)}
    button.secondary:hover{background:rgba(255,255,255,.14);box-shadow:none}
    .output{display:block;min-height:48px;word-break:break-all;resize:none}
    .hint{font-size:13px;color:var(--text-3);margin-top:10px}
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <main class="encoder">
    <h1>UV Link Encoder</h1>
    <p>Enter a website URL and generate the encoded Ultraviolet service link.</p>

    <div class="field">
      <input id="sourceUrl" type="text" placeholder="https://example.com" autocomplete="off" spellcheck="false"/>
    </div>

    <div class="actions">
      <button id="encodeBtn" type="button">Encode</button>
      <button id="copyBtn" class="secondary" type="button">Copy</button>
      <a id="openBtn" class="btn" href="#" target="_blank" rel="noopener">Open</a>
    </div>

    <textarea id="encodedUrl" class="output" readonly placeholder="Encoded link will appear here"></textarea>
    <div id="status" class="hint">Uses the encoder from /uv/uv.config.js.</div>
  </main>

  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script>
    const sourceUrl = document.getElementById('sourceUrl');
    const encodedUrl = document.getElementById('encodedUrl');
    const status = document.getElementById('status');
    const openBtn = document.getElementById('openBtn');

    function normalizeUrl(value) {
      const trimmed = value.trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    function encodeLink() {
      const normalized = normalizeUrl(sourceUrl.value);
      if (!normalized) {
        encodedUrl.value = '';
        openBtn.href = '#';
        status.textContent = 'Enter a URL first.';
        return;
      }

      try {
        const parsed = new URL(normalized);
        const encoded = __uv$config.encodeUrl(parsed.href);
        const path = `${__uv$config.prefix}${encoded}`;
        const fullLink = new URL(path, window.location.origin).href;

        encodedUrl.value = fullLink;
        openBtn.href = fullLink;
        status.textContent = `Encoded ${parsed.hostname}`;
      } catch (error) {
        encodedUrl.value = '';
        openBtn.href = '#';
        status.textContent = 'That does not look like a valid URL.';
      }
    }

    async function copyEncodedLink() {
      if (!encodedUrl.value) encodeLink();
      if (!encodedUrl.value) return;

      await navigator.clipboard.writeText(encodedUrl.value);
      status.textContent = 'Copied encoded link.';
    }

    document.getElementById('encodeBtn').addEventListener('click', encodeLink);
    document.getElementById('copyBtn').addEventListener('click', copyEncodedLink);
    sourceUrl.addEventListener('keydown', event => {
      if (event.key === 'Enter') encodeLink();
    });
  </script>
</body>
</html>
